packages:
  - 'packages/*'
  - 'apps/*'
  - 'web'
  - 'web/e2e'
  - 'npm'
allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
overrides:
  'fast-uri': 3.1.5
  'tar': 7.5.21
  'undici@7': 7.29.0
  'vite@6': 6.4.3
  'js-yaml@4': 4.3.1
  'nanoid@3': 3.3.18
  'browserslist@4': 4.28.7
  'brace-expansion@1': 1.1.18
  'brace-expansion@2': 2.1.4
  'brace-expansion@4': 5.0.9
  'brace-expansion@5': 5.0.9
auditConfig:
  ignoreGhsas:
    GHSA-5xrq-8626-4rwp:
      - packages/broker>vitest
      - packages/agent-runners>vitest
      - packages/protocol>vitest
      - packages/llm-router>vitest
      - packages/credentials>vitest
