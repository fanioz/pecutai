name: llm-router burn-down

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-router-burn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  burn:
    name: Section 10.4 burn-down
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
      - uses: pnpm/action-setup@fe190927da375cc0941557d962b86db179234e3a # ratchet:pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace deps
        run: WUPHF_SKIP_POSTINSTALL=1 pnpm install --frozen-lockfile
      - name: Nightly llm-router burn-down
        run: pnpm --filter @wuphf/llm-router burn:nightly
