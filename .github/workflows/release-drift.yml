name: Release drift check

# Catches drift between this fork's OWN release surfaces. This repo
# (fanioz/pecutai) is a downstream copy of the WUPHF project and no longer
# tracks upstream distribution surfaces.
#
# Surfaces compared:
#   1. Latest semver tag reachable from the default branch (git source of truth)
#   2. Latest GitHub Release `tag_name` (shipped release artifacts)
#
# Deliberately NOT compared: the upstream npm package `wuphf` (registry owner
# nex-ai, repository nex-crm/wuphf). That package is published by the upstream
# project — comparing this fork's tags against it produced permanent false
# drift. Re-add an npm surface here only when this fork publishes its own
# npm package.
#
# The default branch is resolved from the remote (`git ls-remote --symref
# origin HEAD`), not hardcoded: this fork's default branch is `pecutAI`,
# while the upstream workflow assumed `origin/main` and died on
# `fatal: malformed object name origin/main` on every scheduled run.
#
# Any divergence between the two surfaces is a bug — the release workflow
# stalled, failed, or a tag was rewritten. Fail loud and let the team triage.
# Until the first tag and first release exist, the check skips with a notice
# instead of failing every scheduled run.

on:
  schedule:
    # Daily at 14:00 UTC — well after the typical release window so a
    # fresh release has time to propagate before the check runs.
    # Cron is approximate; allow ~15min jitter.
    - cron: "0 14 * * *"
  workflow_dispatch:
  # Also run after every Release workflow run (success or failure) so a
  # stuck or partial release surfaces in minutes, not 24 hours.
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          # Need full tag history to resolve the latest semver tag locally.
          fetch-depth: 0

      - name: Compare release surfaces
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # --- 0. Resolve the repo's real default branch ---
          # The fork's default branch is `pecutAI`, not `main`. Resolve it
          # from the remote HEAD instead of hardcoding so a future rename
          # doesn't break this again.
          # Capture stdout ONLY on success: `gh api` prints the API error
          # JSON (e.g. the 404 from releases/latest on a repo with no
          # releases) to STDOUT, so `|| true` after the assignment would
          # store that JSON in the variable and masquerade as a release.
          default_branch=$(git ls-remote --symref origin HEAD | awk '/^ref:/ { sub("refs/heads/", "", $2); print $2 }') || default_branch=""
          if [ -z "$default_branch" ]; then
            echo "::error::could not resolve the remote default branch (origin HEAD symref)"
            exit 1
          fi
          echo "default branch = $default_branch"

          # --- 1. Latest v* tag reachable from the default branch ---
          # `--merged` filters out stray tags on side branches so a partial
          # release tag pushed to a feature branch doesn't mask drift on the
          # release line. `|| git_tag=""` guards the no-match exit from
          # grep (pipefail) and any SIGPIPE from head.
          git_tag=$(git tag --merged "origin/$default_branch" --sort=-v:refname | grep -E '^v[0-9]' | head -n1) || git_tag=""

          # --- 2. Latest published GitHub Release ---
          # `releases/latest` filters out drafts and pre-releases — what
          # users actually install. A drafted-but-never-published release
          # SHOULD surface as drift here.
          gh_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null) || gh_release=""

          # --- A fork that has never shipped has nothing to drift-check ---
          if [ -z "$git_tag" ] && [ -z "$gh_release" ]; then
            echo "::notice::No v* tags and no published GitHub Releases yet — the release pipeline has not shipped its first release, so there is nothing to drift-check."
            exit 0
          fi

          echo "git tag        = ${git_tag:-<none>}"
          echo "GitHub release = ${gh_release:-<none>}"

          # --- Divergence checks: git tag <-> GitHub Release ---
          fail=0
          if [ -z "$git_tag" ]; then
            echo "::error::GitHub Release ($gh_release) exists but no v* tag is reachable from origin/$default_branch"
            echo "::error::the tag behind the release may have been deleted or rewritten"
            fail=1
          fi
          if [ -z "$gh_release" ]; then
            echo "::error::git tag ($git_tag) exists but there is no published GitHub Release"
            echo "::error::release.yml may have failed or never ran for this tag"
            echo "::error::check: gh run list --workflow=release.yml --limit=5"
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

          git_version=${git_tag#v}
          gh_version=${gh_release#v}
          if [ "$git_version" != "$gh_version" ]; then
            # The surface that is FURTHEST behind names the stuck step.
            older=$(printf '%s\n' "$git_version" "$gh_version" | sort -V | head -n1)
            if [ "$older" = "$gh_version" ]; then
              echo "::error::git tag ($git_tag) is ahead of GitHub Release ($gh_release)"
              echo "::error::release.yml may be stuck or never ran for the latest tag"
            else
              echo "::error::GitHub Release ($gh_release) is ahead of git tag ($git_tag)"
              echo "::error::the latest tag may have been deleted or the release line rewritten"
            fi
            echo "::error::check: gh run list --workflow=release.yml --limit=5"
            exit 1
          fi

          echo "Git tag and GitHub Release agree at $git_tag. ✓"
